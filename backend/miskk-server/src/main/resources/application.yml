server:
  port: 8100

spring:
  application:
    name: miskk-blog
  datasource:
    # MySQL 基础库：用户 / 友链（MyBatis-Plus，t_user / t_friend_*）
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDR:127.0.0.1:3306}/miskk_base?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    # MongoDB 文章库：文章 / 分类 / 标签 / 评论 / 点赞 / 分享 / 观看记录（Spring Data Mongo）
    mongodb:
      uri: ${MONGO_URI:mongodb://${MONGO_ADDR:127.0.0.1:27017}/miskk_article}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    # 配置后验证码将真实发送；未配置时验证码打印到日志
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

miskk:
  jwt:
    # 登录态 JWT 密钥（≥32 字节），签发与解析都在本应用
    secret: ${JWT_SECRET:miskk-blog-jwt-secret-key-please-change-me-in-production-0001}
    expire-hours: 72
  mail:
    # 未配置真实邮箱时，响应中直接返回验证码方便本地调试
    debug: ${MAIL_DEBUG:true}
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  upload:
    # 图片落盘目录（按 user / article 子目录存放），经 /api/static/{user|article}/uploads/** 对外访问
    dir: ${UPLOAD_DIR:${user.home}/.miskk/uploads}
    user-url-prefix: /api/static/user
    article-url-prefix: /api/static/article

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.miskk.blog: info
