server:
  port: 8100

spring:
  application:
    name: miskk-blog
  datasource:
    # PostgreSQL 单库：全部表统一存放（用户/友链/文章/分类/标签/评论/点赞/分享/观看记录）
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_ADDR:127.0.0.1:5432}/miskk_blog?ApplicationName=miskk-blog
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    # 配置后验证码将真实发送；未配置时验证码打印到日志
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

miskk:
  jwt:
    # 登录态 JWT 密钥（≥32 字节），签发与解析都在本应用
    secret: ${JWT_SECRET:miskk-blog-jwt-secret-key-please-change-me-in-production-0001}
    expire-hours: 72
  mail:
    # 未配置真实邮箱时，响应中直接返回验证码方便本地调试
    debug: ${MAIL_DEBUG:true}
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  upload:
    # 图片落盘目录（按 user / article 子目录存放），经 /api/static/{user|article}/uploads/** 对外访问
    dir: ${UPLOAD_DIR:${user.home}/.miskk/uploads}
    user-url-prefix: /api/static/user
    article-url-prefix: /api/static/article

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.miskk.blog: info
