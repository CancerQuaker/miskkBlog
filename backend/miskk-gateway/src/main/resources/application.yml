server:
  port: 8100

spring:
  application:
    name: miskk-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # Nacos 开启鉴权时填写（docker 部署经 NACOS_USERNAME/NACOS_PASSWORD 注入；本地默认无鉴权留空）
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

miskk:
  jwt:
    # JWT 签发与解析都在网关（唯一持有方）。生产环境务必修改为足够长的随机字符串
    secret: ${JWT_SECRET:miskk-blog-jwt-secret-key-please-change-me-in-production-0001}
    expire-hours: 72

logging:
  level:
    cn.miskk.blog: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn
