# 迷失客客の博客 —— 本机产物全栈启动（不在容器内编译）
#
# 与 docker-compose.auto.yml 的区别：后端与 nginx 不做镜像构建，直接挂载本机
# 已构建好的 jar 与 dist 运行，适合本机反复 mvn / npm 构建后整套快速起停。
#
# 前置（本机先构建产物）：
#   mvn clean install -DskipTests     # 仓库根目录执行，生成 backend/miskk-server/target/*.jar
#   cd frontend && npm run build      # 生成 frontend/dist
#
# jar / dist / 初始化 SQL / nginx 模板默认取仓库内对应文件，可在 .env 用 APP_JAR_FILE、
# FRONTEND_DIST_DIR、SQL_INIT_FILE、NGINX_CONF_FILE 改指其他位置（见 .env.example）。
#
# 用法：
#   cp .env.example .env              # 必填 POSTGRES_PASSWORD / JWT_SECRET（与 auto 版通用）
#   docker compose up -d              # 全栈一套启动：PostgreSQL/Redis/后端/nginx
#   docker compose up -d db redis     # 只起基础设施（后端跑 IDEA、前端跑 Vite 时）
#
# 改了代码想生效：本机重新构建，再 docker compose up -d --force-recreate app nginx
# （jar 是单文件挂载，需重建 app 容器确保指向新文件；dist 目录内容更新会直接生效）。
#
# 资源基线按 2核2G 小内存服务器调优：各服务带 mem_limit（合计 ~1G，余量充足），
# 后端 JVM 堆按容器上限的 60% 自适应 + SerialGC；PostgreSQL 限 shared_buffers、
# Redis 限 maxmemory。大机器想放开：调大各 mem_limit 或删掉即可。
#
# 安全模型与数据落盘同 docker-compose.auto.yml：默认只有 nginx 对外（SITE_PORT，默认 80），
# 后端仅映射到宿主机回环地址（127.0.0.1:8100，便于宿主机 nginx 反代），
# PostgreSQL/Redis 的宿主机映射以注释形式预留（见各服务 ports）。

name: miskk

# 后端环境变量（SERVER_PORT 见 app 服务）
x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  LANG: C.UTF-8
  # JVM 标准变量，自动生效。默认按容器 mem_limit 的 60% 定堆 + SerialGC；需固定堆时在 .env 覆盖
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC}
  POSTGRES_ADDR: db:${POSTGRES_SERVER_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-miskk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_SERVER_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:?请在 docker/.env 中设置 JWT_SECRET（≥32位随机字符串）}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  # ---- PostgreSQL：全站唯一数据库（miskk_blog，全部表统一存放） ----
  db:
    image: postgres:18-alpine
    container_name: miskk-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miskk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: miskk_blog
      TZ: ${TZ:-Asia/Shanghai}
      # 首次启动（空数据卷）自动执行建库脚本（建表 + 种子，可重复执行）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    # 小内存调优：shared_buffers 128M + 连接数收紧；384m 上限适配 2G 机器
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    mem_limit: 384m
    # 宿主机端口映射默认不开放（安全模型）；需要时取消注释（POSTGRES_PORT=宿主机 / POSTGRES_SERVER_PORT=容器内，见 .env）
    #ports:
    #  - "${POSTGRES_PORT:-5432}:${POSTGRES_SERVER_PORT:-5432}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 初始化脚本可在 .env 用 SQL_INIT_FILE 改指；仅空数据卷首次启动时执行
      - ${SQL_INIT_FILE:-../sql/miskk_blog.sql}:/docker-entrypoint-initdb.d/miskk_blog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miskk} -d miskk_blog"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: miskk-redis
    restart: unless-stopped
    # REDIS_PASSWORD 为空 = 无密码（与旧版行为一致）；设置后 redis 以该密码启动。
    # 容器内端口改动会经 REDIS_PORT 同步到后端连接配置
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--port", "${REDIS_SERVER_PORT:-6379}", "--maxmemory", "48mb"]
    # 浏览量缓冲 + 按天去重集合，48MB 上限远够用；容器 64m 防 OOM
    mem_limit: 64m
    # 宿主机端口映射默认不开放；需要时取消注释（REDIS_PORT=宿主机 / REDIS_SERVER_PORT=容器内，见 .env）
    #ports:
    #  - "${REDIS_PORT:-6379}:${REDIS_SERVER_PORT:-6379}"
    volumes:
      - redis-data:/data

  # ---- 后端（单体）：挂载 .env 指定的可执行 jar，默认取 backend/miskk-server/target ----
  app:
    image: eclipse-temurin:17-jre
    container_name: miskk-app
    restart: unless-stopped
    environment:
      <<: *backend-env
      # 容器内监听端口（nginx 反代目标）。SERVER_PORT 是 Spring Boot 标准环境变量，
      # 优先级高于 application.yml 的 server.port
      SERVER_PORT: ${APP_PORT:-8100}
      UPLOAD_DIR: /data/uploads
    volumes:
      # 固定映射到容器内 /app/app.jar，宿主机文件名和版本号不受限制
      - ${APP_JAR_FILE:-../backend/miskk-server/target/miskk-server-1.0.0.jar}:/app/app.jar:ro
      - ./uploads:/data/uploads
    # exec 后 java 成为容器主进程（信号可正常送达）
    entrypoint: ["sh", "-c", "exec java -jar /app/app.jar"]
    # 单库 PostgreSQL + 文章正文处理，512m 上限 → JVM 自动取 ~300m 堆
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8100:${APP_PORT:-8100}"

  # ---- 前端静态资源 + 反向代理：唯一对外入口 ----
  nginx:
    image: nginx:alpine
    container_name: miskk-nginx
    restart: unless-stopped
    environment:
      # miskk-nginx.conf 经 nginx 镜像 template 机制在启动时按环境变量渲染
      # （生成 /etc/nginx/conf.d/default.conf，由主配置 include 加载，默认 80 / 8100）
      NGINX_PORT: ${NGINX_PORT:-80}
      APP_PORT: ${APP_PORT:-8100}
    ports:
      - "${SITE_PORT:-80}:${NGINX_PORT:-80}"
    volumes:
      # 本机 npm run build 产物与 nginx 模板均可在 .env 改指
      - ${FRONTEND_DIST_DIR:-../frontend/dist}:/usr/share/nginx/html:ro
      - ${NGINX_CONF_FILE:-./miskk-nginx.conf}:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
    mem_limit: 32m

volumes:
  pg-data:
  redis-data:
