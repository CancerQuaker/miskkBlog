# 迷失客客の博客 —— 本机产物全栈启动（不在容器内编译）
#
# 与 docker-compose.auto.yml 的区别：后端与 nginx 不做镜像构建，直接挂载本机
# 已构建好的 jar 与 dist 运行，适合本机反复 mvn / npm 构建后整套快速起停。
#
# 前置（本机先构建产物）：
#   mvn clean install -DskipTests     # 仓库根目录执行，生成 backend/miskk-server/target/*.jar
#   cd frontend && npm run build      # 生成 frontend/dist
#
# 产物默认取 backend/miskk-server/target 与 frontend/dist，可在 .env 用 APP_JAR_DIR /
# FRONTEND_DIST_DIR 改指任意目录（见 .env.example「本机产物路径」一节）。
#
# 用法：
#   cp .env.example .env              # 必填 MYSQL_PASSWORD / JWT_SECRET（与 auto 版通用）
#   docker compose up -d              # 全栈一套启动：MySQL/Redis/MongoDB/后端/nginx
#   docker compose up -d mysql redis mongo   # 只起基础设施（后端跑 IDEA、前端跑 Vite 时）
#
# 改了代码想生效：本机重新构建，再 docker compose restart app nginx
# （jar 与 dist 是挂载进容器的，restart 即用新产物）。
#
# 资源基线按 2核2G 小内存服务器调优：各服务带 mem_limit（合计 ~1.4G，余量偏紧，
# 2G 机器建议把 app 降到 448m 或 mongo 降到 320m；大机器调大各 mem_limit 或删掉即可），
# 后端 JVM 堆按容器上限的 60% 自适应 + SerialGC；MySQL 关 performance_schema、
# Mongo 限 WiredTiger 缓存、Redis 限 maxmemory。
#
# 安全模型与数据落盘同 docker-compose.auto.yml：默认只有 nginx 对外（SITE_PORT，默认 80），
# 后端仅映射到宿主机回环地址（127.0.0.1:8100，便于宿主机 nginx 反代），
# MySQL/Redis 的宿主机映射以注释形式预留（见各服务 ports）。

name: miskk

# 后端环境变量（SERVER_PORT 见 app 服务）
x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  LANG: C.UTF-8
  # JVM 标准变量，自动生效。默认按容器 mem_limit 的 60% 定堆 + SerialGC；需固定堆时在 .env 覆盖
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC}
  MYSQL_ADDR: mysql:${MYSQL_SERVER_PORT:-3306}
  MYSQL_USER: ${MYSQL_USER:-root}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 中设置 MYSQL_PASSWORD}
  MONGO_ADDR: mongo:${MONGO_SERVER_PORT:-27017}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_SERVER_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:?请在 docker/.env 中设置 JWT_SECRET（≥32位随机字符串）}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  mysql:
    image: mysql:8.4
    container_name: miskk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 docker/.env 中设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 宿主机端口映射默认不开放（安全模型）；需要时取消注释（MYSQL_PORT=宿主机 / MYSQL_SERVER_PORT=容器内，见 .env）
    #ports:
    #  - "${MYSQL_PORT:-3306}:${MYSQL_SERVER_PORT:-3306}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/mysql:/docker-entrypoint-initdb.d:ro   # 首次启动自动执行基础库建表脚本（用户/友链）
    # 容器内端口改动会经 MYSQL_ADDR 同步到后端连接串
    # performance-schema=OFF 省 ~150MB；buffer pool 显式 128M（适配 2G 小内存）
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --port=${MYSQL_SERVER_PORT:-3306} --performance-schema=OFF --innodb-buffer-pool-size=128M
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: miskk-redis
    restart: unless-stopped
    # REDIS_PASSWORD 为空 = 无密码（与旧版行为一致）；设置后 redis 以该密码启动。
    # 容器内端口改动会经 REDIS_PORT 同步到后端连接配置
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--port", "${REDIS_SERVER_PORT:-6379}", "--maxmemory", "48mb"]
    # 浏览量缓冲 + 按天去重集合，48MB 上限远够用；容器 64m 防 OOM
    mem_limit: 64m
    # 宿主机端口映射默认不开放；需要时取消注释（REDIS_PORT=宿主机 / REDIS_SERVER_PORT=容器内，见 .env）
    #ports:
    #  - "${REDIS_PORT:-6379}:${REDIS_SERVER_PORT:-6379}"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:8
    container_name: miskk-mongo
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 首次启动（空数据卷）自动执行文章库种子脚本
      MONGO_INITDB_DATABASE: miskk_article
    # WiredTiger 缓存 256m（默认会吃掉近一半容器内存）；384m 上限适配 2G 小内存
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--port", "${MONGO_SERVER_PORT:-27017}"]
    mem_limit: 384m
    # 宿主机端口映射默认不开放（安全模型）；需要时取消注释
    #ports:
    #  - "${MONGO_PORT:-27017}:${MONGO_SERVER_PORT:-27017}"
    volumes:
      - mongo-data:/data/db
      - ../sql/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' localhost/test | grep -q 1"]
      interval: 10s
      retries: 12
      start_period: 10s

  # ---- 后端（单体）：挂载本机 jar 目录（.env 可改指，默认 backend/miskk-server/target），通配符启动可执行 jar ----
  app:
    image: eclipse-temurin:17-jre
    container_name: miskk-app
    restart: unless-stopped
    environment:
      <<: *backend-env
      # 容器内监听端口（nginx 反代目标）。SERVER_PORT 是 Spring Boot 标准环境变量，
      # 优先级高于 application.yml 的 server.port
      SERVER_PORT: ${APP_PORT:-8100}
      UPLOAD_DIR: /data/uploads
    volumes:
      # 目录内应只有一个可执行 jar（*.jar.original 不参与匹配）
      - ${APP_JAR_DIR:-../backend/miskk-server/target}:/app
      - ./uploads:/data/uploads
    # glob 由 sh 展开，exec 后 java 成为容器主进程（信号可正常送达）
    entrypoint: ["sh", "-c", "exec java -jar /app/*server*.jar"]
    # 单体双栈：MySQL 基础数据 + Mongo 文章域 + 文章正文处理，512m 上限 → JVM 自动取 ~300m 堆
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    ports:
      - "127.0.0.1:8100:${APP_PORT:-8100}"

  # ---- 前端静态资源 + 反向代理：唯一对外入口 ----
  nginx:
    image: nginx:alpine
    container_name: miskk-nginx
    restart: unless-stopped
    environment:
      # nginx.conf 经 nginx 镜像 template 机制在启动时按环境变量渲染
      # （挂载为 /etc/nginx/templates/default.conf.template，默认 80 / 8100）
      NGINX_PORT: ${NGINX_PORT:-80}
      APP_PORT: ${APP_PORT:-8100}
    ports:
      - "${SITE_PORT:-80}:${NGINX_PORT:-80}"
    volumes:
      # 本机 npm run build 产物（.env 可改指）+ 与 auto 版同一份 nginx.conf
      - ${FRONTEND_DIST_DIR:-../frontend/dist}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app
    mem_limit: 32m

volumes:
  mysql-data:
  redis-data:
  mongo-data:
