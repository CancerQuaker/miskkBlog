# 前端站点：静态资源 + /api 反代到网关（与本地 Vite 代理同构，前端代码零改动）
# NGINX_PORT / GATEWAY_PORT 由 nginx 镜像 template 机制在启动时按环境变量渲染
# （见 Dockerfile.frontend 与 docker 目录两个 compose 文件，默认 80 / 8100）
server {
    listen ${NGINX_PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传接口经网关转发，放宽请求体限制（网关侧另有 5MB 单文件限制）
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 产物带内容 hash，可长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gateway:${GATEWAY_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由 + Live2D 模型等 public 静态资源
    location / {
        try_files $uri $uri/ /index.html;
    }
}
