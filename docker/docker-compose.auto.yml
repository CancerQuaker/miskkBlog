# 迷失客客の博客 —— 一键编译+部署（auto：容器内构建，任意装好 Docker 的机器，Ubuntu 云服务器验证目标）
#
# 用法（服务器上）：
#   git clone https://github.com/CancerQuaker/miskkBlog.git
#   cd miskkBlog/docker
#   cp .env.example .env    # 必填 POSTGRES_PASSWORD / JWT_SECRET，其余可选变量见文件内说明
#   bash deploy.sh          # 等价于 docker compose -f docker-compose.auto.yml up -d --build
#
# 安全模型：默认只有 nginx 对外（SITE_PORT，默认 80），PostgreSQL/Redis/后端都只在 compose 内部网络可达，
# 云服务器安全组只需放行 80/443。PostgreSQL/Redis 的宿主机映射以注释形式预留（见各服务 ports）。
# 数据落盘：pg-data / redis-data 卷 + ./uploads/（上传图片），备份这三处即可。
# 内存建议 2核2G 起步（基线 app 512m + PostgreSQL 384m + Redis 64m ≈ 1G）；更小的机器可设 JAVA_TOOL_OPTIONS=-Xmx256m。
#
# 本机已构建好前后端产物（backend/miskk-server/target/*.jar 与 frontend/dist）、想跳过容器内编译
# 直接挂载启动同一套全栈，请用同目录的 docker-compose.yml（同一份 .env 通用）。

name: miskk

# 后端环境变量（SERVER_PORT 见 app 服务）
x-backend-env: &backend-env
  TZ: ${TZ:-Asia/Shanghai}
  # 小内存机器可在 .env 设置 JAVA_TOOL_OPTIONS=-Xmx256m
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
  POSTGRES_ADDR: db:${POSTGRES_SERVER_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-miskk}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_SERVER_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  JWT_SECRET: ${JWT_SECRET:?请在 docker/.env 中设置 JWT_SECRET（≥32位随机字符串）}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

services:
  # ---- PostgreSQL：全站唯一数据库（miskk_blog，全部表统一存放） ----
  db:
    image: postgres:18-alpine
    container_name: miskk-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miskk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 docker/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: miskk_blog
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miskk} -d miskk_blog"]
      interval: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: miskk-redis
    restart: unless-stopped
    # REDIS_PASSWORD 为空 = 无密码（与旧版行为一致）；设置后 redis 以该密码启动。
    # 容器内端口改动会经 REDIS_PORT 同步到后端连接配置
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--port", "${REDIS_SERVER_PORT:-6379}"]
    # 宿主机端口映射默认不开放；需要时取消注释（REDIS_PORT=宿主机 / REDIS_SERVER_PORT=容器内，见 .env）
    #ports:
    #  - "${REDIS_PORT:-6379}:${REDIS_SERVER_PORT:-6379}"
    volumes:
      - redis-data:/data

  # ---- 后端（单体）：容器内 Maven 多阶段构建 ----
  app:
    image: miskk-backend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    container_name: miskk-app
    restart: unless-stopped
    environment:
      <<: *backend-env
      # 容器内监听端口（nginx 反代目标）。SERVER_PORT 是 Spring Boot 标准环境变量，
      # 优先级高于 application.yml 的 server.port
      SERVER_PORT: ${APP_PORT:-8100}
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ---- 前端 + 反向代理：唯一对外入口 ----
  nginx:
    image: miskk-frontend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: miskk-nginx
    restart: unless-stopped
    environment:
      # miskk-nginx.conf template 渲染变量：容器内监听端口 / 后端反代目标端口
      NGINX_PORT: ${NGINX_PORT:-80}
      APP_PORT: ${APP_PORT:-8100}
    ports:
      - "${SITE_PORT:-80}:${NGINX_PORT:-80}"
    depends_on:
      - app

volumes:
  pg-data:
  redis-data:
